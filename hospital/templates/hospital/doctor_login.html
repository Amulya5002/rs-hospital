
{% extends 'hospital/base.html' %}
{% load static %}

{% block title %}Doctor Login | RS Hospital{% endblock %}

{% block content %}

<section class="doctor-login-section">

    <div class="doctor-login-card">

        <h2>Doctor Login</h2>

        <p>Access your patient appointments securely.</p>

        {% for message in messages %}
            <p class="login-message">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Enter username"
                    required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required>
            </div>

            <button type="submit" class="doctor-login-btn">
                Login
            </button>

        </form>

    </div>

</section>

{% endblock %}
